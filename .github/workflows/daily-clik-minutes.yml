name: daily-clik-minutes

# 매일 KST 새벽 6시(= UTC 전날 21시) — 사진 ingest(03:00) 후 3시간 간격.
# CLIK 일일 한도(900회) 안에서 의회 순회. ERROR09 도달하면 즉시 종료되어
# 같은 의회를 다음날 이어서 처리. upsert라 중복 갱신 부담 없음.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Ingest CLIK 회의록 + 조례안
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLIK_API_KEY: ${{ secrets.CLIK_API_KEY }}
          NODE_ENV: production
        run: pnpm exec tsx src/ingest/clikIngest.ts all
