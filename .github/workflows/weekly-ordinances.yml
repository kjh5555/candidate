name: weekly-ordinances

# 매주 일요일 KST 03:30 (= UTC 토요일 18:30). open.law.go.kr lnkOrd+lnkLsOrd
# 자치법규(조례) + 상위 법령 매핑 ingest.
on:
  schedule:
    - cron: "30 18 * * 6"
  workflow_dispatch:
    inputs:
      cmd:
        description: "all | list | links"
        required: false
        default: "all"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Ingest 자치법규 + 법령 매핑 (open.law.go.kr)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LAW_OC: ${{ secrets.LAW_OC }}
          LAW_REFERER: https://www.handspolitics.co.kr/
          NODE_ENV: production
        run: pnpm exec tsx src/ingest/ordinances.ts ${{ inputs.cmd || 'all' }}
