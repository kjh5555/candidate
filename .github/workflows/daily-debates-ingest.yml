name: daily-debates-ingest

# 매일 KST 새벽 4시(= UTC 전날 19시).
# YouTube 채널 RSS → 토론회 영상 식별 → 자막 → Gemini 요약 → Debate 테이블.
# 신규 영상만 upsert로 처리 (이미 summary 있는 영상은 스킵).
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm -v

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Ingest 후보자 토론회 (YouTube + Gemini)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEBATE_YOUTUBE_CHANNEL_IDS: ${{ secrets.DEBATE_YOUTUBE_CHANNEL_IDS }}
          NODE_ENV: production
        run: pnpm exec tsx src/ingest/debateYoutube.ts
